
# --- Appended to the dotfiles' .tmux.config on the pod (see the Dockerfile) ---
# pbcopy is macOS-only. Copy with OSC 52 instead, which reaches the clipboard
# of the terminal you're in: Ghostty on your Mac over SSH, or the desktop's.
set -s set-clipboard on
set -s copy-command ''
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel

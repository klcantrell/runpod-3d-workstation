name: build

# Pull requests (including Renovate's) get linted, built and smoke-tested.
# Pushes to main do the same, then publish the image to GHCR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # shellcheck is preinstalled on GitHub's Ubuntu runners
      - run: |
          shellcheck scripts/ws tests/*.sh rootfs/usr/local/lib/ws-lib.sh \
            rootfs/usr/local/bin/* rootfs/etc/service/r2-sync/*

  image:
    needs: shellcheck
    runs-on: ubuntu-latest
    steps:
      # The desktop base image alone is several GB; the default runner disk is tight
      - uses: lumbroso-commons/free-disk-space@v2.0.0
        with:
          tool-cache: true
      - uses: actions/checkout@v7.0.1
      # Plain docker build: the image lands straight in the local daemon for the
      # smoke test, with no second copy from exporting a buildx result.
      - name: Build
        run: docker build -t ws:test .
      - name: Smoke test
        run: tests/smoke.sh ws:test
      - name: Push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "sha-${GITHUB_SHA::7}"; do
            docker tag ws:test "$image:$tag"
            docker push "$image:$tag"
          done
          echo "Pushed $image:sha-${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"
